<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HarmonyOS Node Fullstack Lab</title>
  <style>
    body { font-family: system-ui, -apple-system, "HarmonyOS Sans", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 22px; }
    .row { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
    button { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 8px; background: #0a59f7; color: #fff; cursor: pointer; }
    button:active { opacity: .8; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 12px; }
    .id { color: #888; font-family: ui-monospace, monospace; font-size: 12px; }
    #status { color: #666; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <h1>HarmonyOS Node.js Fullstack Lab</h1>
  <p>REST API + static hosting, served by official DevNode-OH on HarmonyOS PC.</p>

  <div class="row">
    <input id="name" placeholder="输入条目名称..." />
    <button id="add">添加</button>
  </div>
  <div id="status"></div>
  <ul id="list"></ul>

  <script>
    const $list = document.getElementById('list');
    const $status = document.getElementById('status');
    const $name = document.getElementById('name');

    function render(items) {
      $list.innerHTML = '';
      if (!items.length) {
        $list.innerHTML = '<li>暂无条目</li>';
        return;
      }
      for (const it of items) {
        const li = document.createElement('li');
        li.innerHTML = '<span>' + it.name + '</span><span class="id">' + it.id + '</span>';
        $list.appendChild(li);
      }
    }

    async function load() {
      $status.textContent = '加载中...';
      try {
        const r = await fetch('/api/items');
        const data = await r.json();
        render(data.items);
        $status.textContent = '共 ' + data.count + ' 项 (ok=' + data.ok + ')';
      } catch (e) {
        $status.textContent = '加载失败: ' + e.message;
      }
    }

    async function add() {
      const name = $name.value.trim();
      if (!name) { $status.textContent = '请输入名称'; return; }
      $status.textContent = '提交中...';
      try {
        const r = await fetch('/api/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || r.status);
        $name.value = '';
        await load();
      } catch (e) {
        $status.textContent = '添加失败: ' + e.message;
      }
    }

    document.getElementById('add').addEventListener('click', add);
    $name.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
    load();
  </script>
</body>
</html>
